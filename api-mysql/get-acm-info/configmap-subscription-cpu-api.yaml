apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-cpu-api
  namespace: subscription-control
data:
  subscription-cpu-api.sh: |
    #!/bin/bash
    set -euo pipefail

    ACM="${ACMNAME:-acm}"
    CSVFILE="/tmp/data.csv"
    WORKDIR="/tmp/acm_nodes_$$"
    CLUSTERSFILE="/tmp/clusters_$$.txt"
    LOGFILE="/tmp/acm_nodes.log"
    PARALLEL="${PARALLEL:-8}"
    SUBSTYPELABEL="${SUBSTYPELABEL:-subscription-type}"
    TOKENSECRET="${TOKENSECRET:-application-manager}"
    TOKENSECRETSUFFIX="${TOKENSECRETSUFFIX:-}"
    API_URL="${API_URL:?Missing API_URL}"
    API_TOKEN="${API_TOKEN:?Missing API_TOKEN}"
    LOG_LEVEL="${LOG_LEVEL:-info}"

    rm -f "${CSVFILE}" "${LOGFILE}"
    mkdir -p "${WORKDIR}"
    trap 'rm -rf "${WORKDIR}" "${CLUSTERSFILE}"' EXIT

    LOG() {
      TS="$(date '+%F %T')"
      CLUSTER="${1:-}"
      shift || true
      if [ -n "${CLUSTER}" ]; then
        MSG="${TS} [${CLUSTER}] $*"
      else
        MSG="${TS} $*"
      fi
      echo "${MSG}"
      echo "${MSG}" >> "${LOGFILE}"
    }

    DEBUG() {
      [ "${LOG_LEVEL}" = "debug" ] || return 0
      LOG "$@"
    }

    EXPORT_CLUSTER() {
      CLUSTER="$1"
      OUTFILE="$2"

      LOG "${CLUSTER}" "starting"

      META="$(oc get managedcluster "${CLUSTER}" -o jsonpath="{.metadata.labels.${SUBSTYPELABEL}}{\"|\"}{.metadata.labels.clusterID}{\"|\"}{.spec.url}")"

      SUBTYPE="${META%%|*}"
      META="${META#*|}"
      CLUSTERID="${META%%|*}"
      APIURL="${META#*|}"

      [ -n "${SUBTYPE}" ] || SUBTYPE="no-label"

      if [ -z "${APIURL}" ]; then
        LOG "${CLUSTER}" "ERROR: missing .spec.url"
        return 2
      fi

      TOKEN64="$(oc get secret -n "${CLUSTER}" "${TOKENSECRET}" -o jsonpath='{.data.token}' 2>/dev/null || true)"
      if [ -z "${TOKEN64}" ] && [ -n "${TOKENSECRETSUFFIX}" ]; then
        FALLBACK="${CLUSTER}${TOKENSECRETSUFFIX}"
        LOG "${CLUSTER}" "secret ${TOKENSECRET} not found, trying ${FALLBACK}"
        TOKEN64="$(oc get secret -n "${CLUSTER}" "${FALLBACK}" -o jsonpath='{.data.token}' 2>/dev/null || true)"
      fi
      if [ -z "${TOKEN64}" ]; then
        LOG "${CLUSTER}" "ERROR: missing token (tried ${TOKENSECRET}${TOKENSECRETSUFFIX:+ and ${CLUSTER}${TOKENSECRETSUFFIX}})"
        return 3
      fi
      TOKEN="$(printf '%s' "${TOKEN64}" | base64 -d)"

      NODESFILE="/tmp/nodes_${CLUSTER}_$$.txt"

      LOG "${CLUSTER}" "fetching nodes"

      if ! oc get nodes \
        --token="${TOKEN}" \
        --server="${APIURL}" \
        --insecure-skip-tls-verify \
        --selector='node-role.kubernetes.io/worker,!node-role.kubernetes.io/infra' \
        -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.capacity.cpu}{"|"}{.spec.providerID}{"\n"}{end}' \
        > "${NODESFILE}"; then
        LOG "${CLUSTER}" "ERROR: oc get nodes failed"
        rm -f "${NODESFILE}"
        return 4
      fi

      : > "${OUTFILE}"

      while IFS='|' read -r NODENAME NODECPU PROVIDERID; do
        [ -n "${NODENAME}" ] || continue
        printf '%s,%s,%s,%s,%s,%s,%s\n' \
          "${ACM}" "${CLUSTER}" "${CLUSTERID}" "${SUBTYPE}" "${NODENAME}" "${NODECPU}" "${PROVIDERID}" \
          >> "${OUTFILE}"
      done < "${NODESFILE}"

      rm -f "${NODESFILE}"

      ROWS="$(wc -l < "${OUTFILE}" | tr -d ' ')"
      LOG "${CLUSTER}" "done rows=${ROWS}"
      if [ "${LOG_LEVEL}" = "debug" ] && [ -s "${OUTFILE}" ]; then
        DEBUG "${CLUSTER}" "CSV content:"
        while IFS= read -r LINE; do
          DEBUG "${CLUSTER}" "  ${LINE}"
        done < "${OUTFILE}"
      fi
    }

    export ACM WORKDIR LOGFILE SUBSTYPELABEL TOKENSECRET TOKENSECRETSUFFIX LOG_LEVEL
    export -f LOG DEBUG EXPORT_CLUSTER

    LOG "" "log_level=${LOG_LEVEL}"
    DEBUG "" "ACM=${ACM} API_URL=${API_URL}"
    DEBUG "" "TOKENSECRET=${TOKENSECRET} TOKENSECRETSUFFIX=${TOKENSECRETSUFFIX:-<empty>}"
    DEBUG "" "SUBSTYPELABEL=${SUBSTYPELABEL} PARALLEL=${PARALLEL}"

    LOG "" "listing managedclusters"

    oc get managedclusters -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
      | grep -v '^local-cluster$' \
      > "${CLUSTERSFILE}"

    TOTAL="$(wc -l < "${CLUSTERSFILE}" | tr -d ' ')"
    LOG "" "clusters=${TOTAL} parallel=${PARALLEL}"

    xargs -r -P "${PARALLEL}" -I{} bash -c '
      : "${ACM:?}" "${WORKDIR:?}" "${LOGFILE:?}"
      CLUSTER="{}"
      OUTFILE="${WORKDIR}/${CLUSTER}.csv"
      if EXPORT_CLUSTER "${CLUSTER}" "${OUTFILE}"; then
        touch "${WORKDIR}/${CLUSTER}.ok"
      else
        RC=$?
        case ${RC} in
          2) REASON="missing apiserverurl claim" ;;
          3) REASON="missing token secret" ;;
          4) REASON="oc get nodes failed" ;;
          *) REASON="unknown error (exit=${RC})" ;;
        esac
        LOG "${CLUSTER}" "WARN: skipped — ${REASON}"
        echo "${REASON}" > "${WORKDIR}/${CLUSTER}.fail"
      fi
    ' < "${CLUSTERSFILE}"

    OK_COUNT="$(find "${WORKDIR}" -maxdepth 1 -name '*.ok' | wc -l | tr -d ' ')"
    FAIL_COUNT="$(find "${WORKDIR}" -maxdepth 1 -name '*.fail' | wc -l | tr -d ' ')"

    LOG "" "results: ok=${OK_COUNT} failed=${FAIL_COUNT} total=${TOTAL}"

    if [ "${OK_COUNT}" -eq 0 ]; then
      LOG "" "all clusters failed"
      LOG "" "--- failed clusters ---"
      for F in "${WORKDIR}"/*.fail; do
        [ -f "${F}" ] || continue
        CNAME="$(basename "${F}" .fail)"
        CREASON="$(cat "${F}")"
        LOG "" "  ${CNAME}: ${CREASON}"
      done
      LOG "" "---"
      exit 1
    fi

    if [ "${FAIL_COUNT}" -gt 0 ]; then
      LOG "" "WARNING: ${FAIL_COUNT} cluster(s) failed, continuing with partial results"
      LOG "" "--- failed clusters ---"
      for F in "${WORKDIR}"/*.fail; do
        [ -f "${F}" ] || continue
        CNAME="$(basename "${F}" .fail)"
        CREASON="$(cat "${F}")"
        LOG "" "  ${CNAME}: ${CREASON}"
      done
      LOG "" "---"
    fi

    LOG "" "merging results"
    cat "${WORKDIR}"/*.csv > "${CSVFILE}" 2>/dev/null || : > "${CSVFILE}"

    FINAL_ROWS="$(wc -l < "${CSVFILE}" | tr -d " ")"
    LOG "" "merged rows=${FINAL_ROWS}"

    if [ "${FINAL_ROWS}" -eq 0 ]; then
      LOG "" "WARNING: no data to send"
      exit 0
    fi

    LOG "" "converting CSV to JSON"
    PAYLOAD="/tmp/payload.json"

    awk -F',' '
    BEGIN { printf "[" }
    NF >= 7 && $1 != "" {
      gsub(/"/, "\\\"", $1)
      gsub(/"/, "\\\"", $2)
      gsub(/"/, "\\\"", $3)
      gsub(/"/, "\\\"", $4)
      gsub(/"/, "\\\"", $5)
      gsub(/"/, "\\\"", $7)
      if (count > 0) printf ","
      printf "{\"acm\":\"%s\",\"cluster\":\"%s\",\"clusterid\":\"%s\",\"type\":\"%s\",\"node\":\"%s\",\"cpu\":%s,\"providerid\":\"%s\"}", $1, $2, $3, $4, $5, $6, $7
      count++
    }
    END { printf "]" }
    ' "${CSVFILE}" > "${PAYLOAD}"

    PAYLOAD_SIZE="$(wc -c < "${PAYLOAD}" | tr -d ' ')"
    LOG "" "sending ${FINAL_ROWS} records to ${API_URL}/api/subscriptions (${PAYLOAD_SIZE} bytes)"

    if [ "${LOG_LEVEL}" = "debug" ]; then
      LOG "" "DEBUG --- payload begin ---"
      cat "${PAYLOAD}"
      echo
      LOG "" "DEBUG --- payload end ---"
      CURL_VERBOSE="-v"
    else
      CURL_VERBOSE=""
    fi

    if ! HTTP_CODE="$(curl -sS -k --connect-timeout 30 --max-time 300 \
      ${CURL_VERBOSE} -o /tmp/api_response.txt -w '%{http_code}' \
      -X POST "${API_URL}/api/subscriptions" \
      -H 'Content-Type: application/json' \
      -H "Authorization: Bearer ${API_TOKEN}" \
      -d @"${PAYLOAD}" 2>/tmp/api_curl_err.txt)"; then
      CURL_ERR="$(cat /tmp/api_curl_err.txt)"
      LOG "" "ERROR: curl failed — ${CURL_ERR}"
      exit 1
    fi

    API_BODY="$(cat /tmp/api_response.txt)"

    if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
      LOG "" "API insert OK (HTTP ${HTTP_CODE}): ${API_BODY}"
    else
      LOG "" "ERROR: API insert failed (HTTP ${HTTP_CODE}): ${API_BODY}"
      exit 1
    fi

    LOG "" "finished ok=${OK_COUNT} failed=${FAIL_COUNT}"
    exit 0
